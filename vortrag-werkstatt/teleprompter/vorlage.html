<title>/*TITEL*/</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: Lesefeld mittig wie ein Blatt, Steuerleiste unten; aktuelles Wort auf 38 % Höhe. Hoher Kontrast, hell und dunkel. */
:root{--bg:#fbfaf7;--panel:#eeece6;--fg:#15181d;--dim:#8b9099;--next:#15181d;--hot:#ffe680;--hotfg:#15181d;--accent:#1f6f8b;--line:#d6d3cb;--btn:#ffffff;
--read:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16191e;--panel:#1f242b;--fg:#f2f2ee;--dim:#7d848f;--next:#f2f2ee;--hot:#ffe680;--hotfg:#15181d;--accent:#6cc3e0;--line:#343b45;--btn:#2a3038;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16191e;--panel:#1f242b;--fg:#f2f2ee;--dim:#7d848f;--next:#f2f2ee;--hot:#ffe680;--hotfg:#15181d;--accent:#6cc3e0;--line:#343b45;--btn:#2a3038;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--read);margin:0;overflow:hidden}
#stage{position:absolute;inset:0 0 88px 0;overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#guide{display:none}
#hint{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:12px;font-family:var(--mono);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
#text{max-width:38ch;margin:0 auto;font-size:clamp(24px,3.6vw,40px);line-height:1.65;transition:transform .35s ease;will-change:transform;padding-block:40vh 60vh}
#text.wide{max-width:36ch}
.slide{font-family:var(--mono);font-size:.5em;font-weight:500;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;margin:1.6em 0 .4em;display:block}
.w{color:var(--next);cursor:pointer;border-radius:.15em;padding:0 .04em;transition:color .12s}
.w.done{color:var(--dim)}
.w.now{color:var(--hotfg);background:var(--hot);box-shadow:0 0 0 .08em var(--hot)}
#bar{position:fixed;left:0;right:0;bottom:0;height:88px;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;font-size:15px}
button,select{font:inherit;color:var(--fg);background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#play{background:var(--accent);color:var(--bg);font-weight:700;min-width:96px;border-color:var(--accent)}
.grp{display:flex;align-items:center;gap:6px}
#wpm{font-family:var(--mono);min-width:5.5ch;text-align:right}
#time{font-family:var(--mono);color:var(--dim);margin-left:auto;font-variant-numeric:tabular-nums}
input[type=range]{width:120px;accent-color:var(--accent)}
@media (max-width:640px){#bar{height:auto;padding-block:8px}#stage{bottom:120px}#time{margin-left:0}}
@media (prefers-reduced-motion:reduce){#text{transition:none}}
</style>
<div id="stage"><div id="guide"></div><div id="text"></div><div id="hint" hidden>Luft holen</div></div>
<div id="bar">
  <button id="play" type="button">▶ Start</button>
  <button id="back" type="button" title="Zurück (←)">⟲ 5 Wörter</button>
  <div class="grp"><label for="speed">Tempo</label><input id="speed" type="range" min="80" max="240" step="5" value="150"><span id="wpm">150</span><span>W/min</span></div>
  <div class="grp"><label for="jump">Folie</label><select id="jump"></select></div>
  <div class="grp"><label for="size">Schrift</label><input id="size" type="range" min="20" max="64" step="2" value="36"></div>
  <span id="time">0:00 / 0:00</span>
</div>
<script>
const SLIDES = /*FOLIEN*/[];
const text=document.getElementById('text'), jump=document.getElementById('jump'), hint=document.getElementById('hint');
const words=[]; // {el, pause}
// Atempausen in Sekunden (beim Lesen zusaetzlich zur Wortdauer)
const PAUSE={komma:0.35, doppelpunkt:0.5, punkt:0.8, absatz:2.0};
SLIDES.forEach(([title,body],si)=>{
  const h=document.createElement('span'); h.className='slide'; h.textContent=title; h.dataset.slide=si; text.appendChild(h);
  const p=document.createElement('div');
  body.split(/\s+/).forEach(tok=>{
    const s=document.createElement('span'); s.className='w'; s.textContent=tok; s.dataset.i=words.length;
    let pause=0; if(/[.!?]$/.test(tok)) pause=PAUSE.punkt; else if(/:$/.test(tok)) pause=PAUSE.doppelpunkt; else if(/[,;]$/.test(tok)) pause=PAUSE.komma;
    words.push({el:s,pause,slide:si}); p.appendChild(s); p.appendChild(document.createTextNode(' '));
  });
  text.appendChild(p);
  words[words.length-1].pause=PAUSE.absatz;
  const o=document.createElement('option'); o.value=si; o.textContent=title; jump.appendChild(o);
});
let idx=0, playing=false, timer=null, wpm=150, elapsed=0, lastTick=0;
const play=document.getElementById('play'), speed=document.getElementById('speed'), wpmEl=document.getElementById('wpm'), timeEl=document.getElementById('time');
try{const s=localStorage.getItem('prompter-wpm'); if(s){wpm=+s; speed.value=wpm;}}catch(e){}
wpmEl.textContent=wpm;
function unit(){return 60/wpm;}
function wordDur(i){const w=words[i]; const len=w.el.textContent.length; return unit()*(0.7+Math.min(len,14)/22) + w.pause;}
function totalLeft(from){let t=0; for(let i=from;i<words.length;i++) t+=wordDur(i); return t;}
function fmt(s){s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function render(){
  words.forEach((w,i)=>{w.el.classList.toggle('done',i<idx); w.el.classList.toggle('now',i===idx);});
  const cur=words[Math.min(idx,words.length-1)].el;
  const stage=document.getElementById('stage').getBoundingClientRect();
  const target=stage.height*0.38;
  const y=cur.offsetTop + cur.offsetHeight/2;
  text.style.transform='translateY('+(target - y)+'px)';
  jump.value=words[Math.min(idx,words.length-1)].slide;
  timeEl.textContent=fmt(elapsed)+' / noch '+fmt(totalLeft(idx));
}
function step(){
  if(!playing) return;
  if(idx>=words.length-1){render(); stop(); return;}
  const d=wordDur(idx); elapsed+=d; const breath=words[idx].pause>0; idx++; render(); hint.hidden=!breath;
  if(breath) setTimeout(()=>{hint.hidden=true;}, Math.max(150,(words[idx-1].pause)*1000-80));
  timer=setTimeout(step,d*1000);
}
let wake=null;
async function start(){ if(idx>=words.length-1){idx=0;elapsed=0;} playing=true; play.textContent='❚❚ Pause';
  try{ wake=await navigator.wakeLock?.request('screen'); }catch(e){}
  timer=setTimeout(step,wordDur(idx)*1000); render(); }
function stop(){ playing=false; clearTimeout(timer); play.textContent='▶ Weiter'; try{wake&&wake.release(); wake=null;}catch(e){} }
play.onclick=()=>playing?stop():start();
document.getElementById('back').onclick=()=>{idx=Math.max(0,idx-5); render();};
speed.oninput=()=>{wpm=+speed.value; wpmEl.textContent=wpm; try{localStorage.setItem('prompter-wpm',wpm);}catch(e){} render();};
document.getElementById('size').oninput=e=>{text.style.fontSize=e.target.value+'px'; requestAnimationFrame(render);};
jump.onchange=()=>{const si=+jump.value; idx=words.findIndex(w=>w.slide===si); render();};
text.addEventListener('click',e=>{const i=e.target.dataset&&e.target.dataset.i; if(i!==undefined){idx=+i; render();}});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.code==='Space'){e.preventDefault(); playing?stop():start();}
  else if(e.key==='ArrowUp'){speed.value=Math.min(240,wpm+10); speed.oninput();}
  else if(e.key==='ArrowDown'){speed.value=Math.max(80,wpm-10); speed.oninput();}
  else if(e.key==='ArrowLeft'){idx=Math.max(0,idx-5); render();}
  else if(e.key==='ArrowRight'){idx=Math.min(words.length-1,idx+5); render();}
});
addEventListener('resize',()=>requestAnimationFrame(render));
document.fonts?.ready.then(render); render();
</script>
