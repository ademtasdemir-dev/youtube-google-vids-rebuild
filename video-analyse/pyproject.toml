[project]
name = "video-analyse"
version = "1.0.0"
description = "Analysiert YouTube-Videos: Inhalt, Aufbau, Bilder, Transkript mit Sprechern, Stimme/Musik trennen, Cartesia-Text"
requires-python = ">=3.11,<3.13"
dependencies = [
  "yt-dlp[default,deno]>=2026.10.26",
  "faster-whisper>=1.1.0",
  "numpy<2.3",
  "imageio-ffmpeg>=0.5.1",
  "num2words>=0.5.13",
  "pillow>=10.0",
  "torch==2.5.1",
  "torchaudio==2.5.1",
  "demucs==4.0.1",
  "speechbrain==1.0.3",
  "soundfile>=0.12",
  "requests>=2.31",
  "huggingface_hub>=0.23,<0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["langsam: kompletter Durchlauf mit echten Modellen (dauert einige Minuten)"]
addopts = "-m 'not langsam'"
